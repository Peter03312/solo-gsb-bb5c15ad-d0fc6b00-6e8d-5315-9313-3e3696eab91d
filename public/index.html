<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数字展品授权核验</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>数字展品授权核验台</h1>
    <div class="basis" title="授权或来源关系每变更一次，核验依据版本递增；发布时依据过期会被拒绝">
      核验依据版本：<b id="basisVersion">–</b>
      <span id="reviewBadge" class="badge badge-review hidden">需复核：0</span>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="materials">① 素材与来源</button>
    <button class="tab" data-tab="packages">② 展览包与核验发布</button>
  </nav>

  <main>
    <!-- ========== 素材与来源 ========== -->
    <section id="tab-materials" class="tabpanel active">
      <div class="toolbar toolbar-flex">
        <form id="addMaterialForm" class="inline-form">
          <input name="title" placeholder="素材名称（必填）" required />
          <input name="kind" placeholder="类型，如 video / audio / image / font" class="w-10" />
          <button class="btn" type="submit">＋ 登记素材</button>
        </form>
        <label class="preview-toggle" title="开启后，授权/来源关系的增改撤删将先弹出影响预演，确认后才真正提交">
          <input type="checkbox" id="previewMode" checked />
          授权 / 来源变更先做影响预演，再确认提交
        </label>
      </div>
      <div id="materialsList" class="grid"></div>
    </section>

    <!-- ========== 展览包 ========== -->
    <section id="tab-packages" class="tabpanel hidden">
      <div class="panel">
        <h2 id="pkgFormTitle">新建待发布展览包</h2>
        <form id="packageForm">
          <input type="hidden" name="packageId" />
          <div class="form-row">
            <label>包名称<input name="name" required placeholder="例如：常设展屏幕展包" /></label>
          </div>
          <div class="form-row four">
            <label>展示媒介<input name="medium" required placeholder="屏幕放映（* 表示任意媒介）" /></label>
            <label>展示地区<input name="region" required placeholder="中国大陆（* 表示任意地区）" /></label>
            <label>起始日期<input name="useFrom" type="date" required /></label>
            <label>截止日期<input name="useTo" type="date" required /></label>
          </div>
          <div class="form-row">
            <label class="pick-label">选取素材（自动包含其全部来源链）</label>
            <div id="materialPick" class="pick"></div>
          </div>
          <div class="form-row actions">
            <button type="submit" class="btn btn-primary" id="savePkgBtn">保存待发布包</button>
            <button type="button" class="btn" id="verifyPkgBtn">核验</button>
            <button type="button" class="btn" id="scheduleFormBtn">搜索档期</button>
            <button type="button" class="btn" id="newPkgBtn">清空表单</button>
          </div>
        </form>
      </div>

      <div id="verifyPanel" class="panel hidden"></div>
      <div id="packagesList" class="stack"></div>
    </section>
  </main>

  <!-- 快照查看 / 影响预演弹层 -->
  <div id="modalBackdrop" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-head">
        <h3 id="modalTitle">核验快照</h3>
        <button class="btn" id="modalClose">关闭</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
      <div id="modalFoot" class="modal-foot hidden"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/app.js"></script>
</body>
</html>
